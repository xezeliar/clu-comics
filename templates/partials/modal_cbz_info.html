<!-- CBZ Info Modal – shared partial (clu-cbz-info.js) -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/cbz-info.css') }}">
<div class="modal fade" id="cbzInfoModal" tabindex="-1" aria-labelledby="cbzInfoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header ci-hd">
        <div class="ci-id">
          <h5 class="modal-title" id="cbzInfoModalLabel">CBZ Information</h5>
          <p class="ci-sub mb-0" id="cbzInfoSub"></p>
          <p class="ci-fn mb-0 font-monospace" id="cbzInfoFileName"></p>
        </div>
        <div class="ci-nav">
          <!-- Prev / Next file (shown by clu-cbz-info.js when a file list is given) -->
          <span id="cbzNavButtons" class="ci-nav-files d-none">
            <button type="button" id="cbzPrevBtn" class="btn ci-ib" aria-label="Previous file" title="Previous file">
              <i class="bi bi-chevron-left" aria-hidden="true"></i>
            </button>
            <span class="ci-pos" id="cbzNavPos"></span>
            <button type="button" id="cbzNextBtn" class="btn ci-ib" aria-label="Next file" title="Next file">
              <i class="bi bi-chevron-right" aria-hidden="true"></i>
            </button>
          </span>
          <button type="button" class="btn-close ci-x" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
      </div>
      <div class="modal-body" id="cbzInfoContent">
        <div class="text-center">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2">Loading CBZ information...</p>
        </div>
      </div>
      <div class="modal-footer ci-ft" id="cbzInfoFooter">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Clear ComicInfo.xml confirmation – stacks on top of #cbzInfoModal, which stays open -->
<div class="modal fade" id="clearComicInfoConfirmModal" tabindex="-1"
  aria-labelledby="clearComicInfoConfirmModalLabel" aria-hidden="true"
  data-enter-confirm="confirmClearComicInfoBtn">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-danger" id="clearComicInfoConfirmModalLabel">
          <i class="bi bi-eraser me-2"></i>Delete ComicInfo.xml
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Delete ComicInfo.xml from <strong id="clearComicInfoFileName"></strong>?</p>
        <div class="alert alert-warning mb-0">
          <i class="bi bi-exclamation-triangle me-2"></i>This permanently removes the embedded
          metadata from this file and cannot be undone.
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmClearComicInfoBtn">
          <i class="bi bi-eraser me-1"></i>Delete
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Unsaved metadata edits – stacks on top of #cbzInfoModal when navigating away -->
<div class="modal fade" id="cbzDiscardEditsModal" tabindex="-1"
  aria-labelledby="cbzDiscardEditsModalLabel" aria-hidden="true"
  data-enter-confirm="cbzKeepEditingBtn">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cbzDiscardEditsModalLabel">
          <i class="bi bi-exclamation-triangle me-2"></i>Unsaved changes
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">Discard <strong id="cbzDiscardEditsCount"></strong> to this comic's metadata?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cbzKeepEditingBtn" data-bs-dismiss="modal">Keep editing</button>
        <button type="button" class="btn btn-danger" id="cbzConfirmDiscardEditsBtn">Discard</button>
      </div>
    </div>
  </div>
</div>
