{# The Manage Tags dialog; openTagsModal()/saveTags() live in reading_list.js.
   Included by the index and by a list's own page (Clerks only). #}
<!-- Tags Modal -->
<div class="modal fade" id="tagsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Manage Tags</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3 position-relative">
                    <input type="text" class="form-control" id="tagInput" placeholder="Type to add tag..."
                        autocomplete="off">
                    <div id="tagSuggestions" class="list-group position-absolute w-100 shadow"
                        style="z-index:1050; max-height: 200px; overflow-y: auto;"></div>
                </div>
                <div id="selectedTags" class="d-flex flex-wrap gap-2 mb-3">
                    <!-- Selected tags rendered here -->
                </div>
                <hr>
                <div class="mb-2 text-muted small">Suggestions:</div>
                <div id="predefinedTags" class="d-flex flex-wrap gap-2">
                    <!-- Predefined tag buttons -->
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-link text-decoration-none text-muted"
                    data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary px-4" onclick="saveTags()">Save Tags</button>
            </div>
        </div>
    </div>
</div>
